name: koko_road_dash
description: "Koko Road Dash - a turn-based road-crossing puzzle."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── White-part game runtime (already in use) ─────────────────
  video_player: ^2.9.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

  # ── Lane bridge layer ────────────────────────────────────────
  # Versions intentionally diverge from sibling projects to keep
  # binary fingerprints unique across the portfolio.
  appsflyer_sdk: ^6.17.0
  app_tracking_transparency: ^2.0.6+1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.8
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.1.4
  http: ^1.4.0
  device_info_plus: ^12.0.0
  flutter_secure_storage: ^9.2.2
  package_info_plus: ^8.3.0
  webview_flutter: ^4.11.0
  webview_flutter_android: ^4.4.0
  webview_flutter_wkwebview: ^3.22.0
  file_picker: ^10.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Disable SPM — Firebase wired through CocoaPods to keep module
  # graphs stable for the Notification Service Extension target.
  config:
    enable-swift-package-manager: false

  assets:
    - assets/
    - assets/Loading/
    - assets/notifications/
    - assets/nowifi/
    - assets/Gameplay_assets/backrounds/
    - assets/Gameplay_assets/cars/
    - assets/Gameplay_assets/skins/
